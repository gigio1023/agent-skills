# Merge into ~/.codex/config.toml after review. Keys verified against Codex CLI 0.154.0;
# gpt-6-sol needs Codex CLI 0.156.1 or later.
# Unnamed workers go to GPT-6 Sol at xhigh instead of inheriting the lead. Always set the
# effort with the model: a model alone falls back to that model's catalog default.

[agents]
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "xhigh"

# Role files live in ~/.codex/agents/*.toml (see assets/codex/agents/). They are discovered
# from that directory without stanzas here. Declaring at least one role also makes the
# spawn tool expose agent_type. To lower a role's effort, edit model_reasoning_effort in its file.
