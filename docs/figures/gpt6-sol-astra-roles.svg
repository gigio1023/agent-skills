<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 708" width="720" height="708" role="img" aria-labelledby="title desc">
  <title id="title">Codex roles under an Astra lead</title>
  <desc id="desc">Before: luna-clerk, terra-scout, sol-builder on GPT-5.6 models and the [agents] default on gpt-5.6-terra. After: sol-clerk, sol-scout, sol-builder and the default on gpt-6-sol at xhigh; astra-judge unchanged.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#D9D9D9" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    .entity { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
    .sub { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #A3A6A2; text-anchor: middle; }
    .field { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #FFFFFF; text-anchor: middle; }
    .edge { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #FFFFFF; }
    .panel { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #A3A6A2; }
    .box { fill: #1A1A1A; stroke: #6B6E6A; stroke-width: 1.2; }
    .box-accent { fill: #23244A; stroke: #8386EB; stroke-width: 1.2; }
    .flow { fill: none; stroke: #D9D9D9; stroke-width: 1.2; }
    .rule { fill: none; stroke: #3A3A3A; stroke-width: 1.2; }
  </style>
  <rect width="720" height="708" rx="12" fill="#0D0D0D"/>
  <text class="panel" x="16" y="22">main</text>
  <g id="main-lead">
    <rect class="box" x="16" y="123.0" width="168" height="56" rx="16"/>
    <text class="entity" x="100" y="146.5">Astra lead</text>
    <text class="sub" x="100" y="164.5">gpt-6-astra</text>
  </g>
  <g id="main-luna-clerk">
    <rect class="box" x="408" y="40" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="59.5">luna-clerk</text>
    <text class="sub" x="556" y="77.5">gpt-5.6-luna, xhigh</text>
  </g>
  <g id="main-terra-scout">
    <rect class="box" x="408" y="98" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="117.5">terra-scout</text>
    <text class="sub" x="556" y="135.5">gpt-5.6-terra, xhigh</text>
  </g>
  <g id="main-sol-builder">
    <rect class="box" x="408" y="156" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="175.5">sol-builder</text>
    <text class="sub" x="556" y="193.5">gpt-5.6-sol, xhigh</text>
  </g>
  <g id="main-astra-judge">
    <rect class="box" x="408" y="214" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="233.5">astra-judge</text>
    <text class="sub" x="556" y="251.5">gpt-6-astra, high</text>
  </g>
  <g id="main-default">
    <rect class="box" x="408" y="286" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="305.5">[agents] default_subagent_model</text>
    <text class="sub" x="556" y="323.5">gpt-5.6-terra, xhigh</text>
  </g>
  <g id="main-spawn-role">
    <path class="flow" d="M184 151 H312"/>
    <text class="edge" x="196" y="143" text-anchor="start">agent_type</text>
  </g>
  <g id="main-trunk">
    <path class="flow" d="M312 64 V238"/>
  </g>
  <g id="main-to-luna-clerk">
    <path class="flow" d="M312 64 H407" marker-end="url(#arrow)"/>
  </g>
  <g id="main-to-terra-scout">
    <path class="flow" d="M312 122 H407" marker-end="url(#arrow)"/>
  </g>
  <g id="main-to-sol-builder">
    <path class="flow" d="M312 180 H407" marker-end="url(#arrow)"/>
  </g>
  <g id="main-to-astra-judge">
    <path class="flow" d="M312 238 H407" marker-end="url(#arrow)"/>
  </g>
  <g id="main-spawn-default">
    <path class="flow" d="M100 179 V310 H407" marker-end="url(#arrow)"/>
    <text class="edge" x="196" y="302" text-anchor="start">no agent_type</text>
  </g>
  <path class="rule" d="M16 354 H704"/>
  <text class="panel" x="16" y="376">this PR</text>
  <g id="pr-lead">
    <rect class="box" x="16" y="477.0" width="168" height="56" rx="16"/>
    <text class="entity" x="100" y="500.5">Astra lead</text>
    <text class="sub" x="100" y="518.5">gpt-6-astra</text>
  </g>
  <g id="pr-sol-clerk">
    <rect class="box-accent" x="408" y="394" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="413.5">sol-clerk</text>
    <text class="sub" x="556" y="431.5">gpt-6-sol, xhigh</text>
  </g>
  <g id="pr-sol-scout">
    <rect class="box-accent" x="408" y="452" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="471.5">sol-scout</text>
    <text class="sub" x="556" y="489.5">gpt-6-sol, xhigh</text>
  </g>
  <g id="pr-sol-builder">
    <rect class="box-accent" x="408" y="510" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="529.5">sol-builder</text>
    <text class="sub" x="556" y="547.5">gpt-6-sol, xhigh</text>
  </g>
  <g id="pr-astra-judge">
    <rect class="box" x="408" y="568" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="587.5">astra-judge</text>
    <text class="sub" x="556" y="605.5">gpt-6-astra, high</text>
  </g>
  <g id="pr-default">
    <rect class="box-accent" x="408" y="640" width="296" height="48" rx="16"/>
    <text class="entity" x="556" y="659.5">[agents] default_subagent_model</text>
    <text class="sub" x="556" y="677.5">gpt-6-sol, xhigh</text>
  </g>
  <g id="pr-spawn-role">
    <path class="flow" d="M184 505 H312"/>
    <text class="edge" x="196" y="497" text-anchor="start">agent_type</text>
  </g>
  <g id="pr-trunk">
    <path class="flow" d="M312 418 V592"/>
  </g>
  <g id="pr-to-sol-clerk">
    <path class="flow" d="M312 418 H407" marker-end="url(#arrow)"/>
  </g>
  <g id="pr-to-sol-scout">
    <path class="flow" d="M312 476 H407" marker-end="url(#arrow)"/>
  </g>
  <g id="pr-to-sol-builder">
    <path class="flow" d="M312 534 H407" marker-end="url(#arrow)"/>
  </g>
  <g id="pr-to-astra-judge">
    <path class="flow" d="M312 592 H407" marker-end="url(#arrow)"/>
  </g>
  <g id="pr-spawn-default">
    <path class="flow" d="M100 533 V664 H407" marker-end="url(#arrow)"/>
    <text class="edge" x="196" y="656" text-anchor="start">no agent_type</text>
  </g>
</svg>
