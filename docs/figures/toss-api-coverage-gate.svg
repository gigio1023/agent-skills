<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="720" height="368" role="img" aria-labelledby="title desc">
  <title id="title">Toss API coverage gate</title>
  <desc id="desc">Before: coverage_ok checks OpenAPI paths for missing or unclassified endpoints. After: it also requires every AsyncAPI channel and operation to be classified and every expected one present.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse" overflow="visible">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#D9D9D9" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    .entity { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #FFFFFF; text-anchor: middle; }
    .sub { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #A3A6A2; text-anchor: middle; }
    .field { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #FFFFFF; text-anchor: middle; }
    .edge { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #FFFFFF; }
    .panel { font-family: "IBM Plex Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; fill: #A3A6A2; }
    .box { fill: #1A1A1A; stroke: #6B6E6A; stroke-width: 1.2; }
    .box-accent { fill: #23244A; stroke: #8386EB; stroke-width: 1.2; }
    .flow { fill: none; stroke: #D9D9D9; stroke-width: 1.2; }
    .rule { fill: none; stroke: #3A3A3A; stroke-width: 1.2; }
  </style>
  <rect width="720" height="368" rx="12" fill="#0D0D0D"/>
  <text class="panel" x="16" y="24">main</text>
  <g id="main-endpoints-doc">
    <rect class="box" x="16" y="40" width="128" height="56" rx="16"/>
    <text class="entity" x="80" y="63.5">openapi.json</text>
    <text class="sub" x="80" y="81.5">REST</text>
  </g>
  <g id="main-endpoints-fields">
    <rect class="box" x="236" y="40" width="336" height="56" rx="16"/>
    <text class="field" x="404" y="63.5">missing_expected_endpoints</text>
    <text class="field" x="404" y="81.5">unclassified_official_endpoints</text>
  </g>
  <g id="main-endpoints-read">
    <path class="flow" d="M144 68 H235" marker-end="url(#arrow)"/>
    <text class="edge" x="190" y="60" text-anchor="middle">paths</text>
  </g>
  <g id="main-endpoints-gate">
    <path class="flow" d="M572 68 H595" marker-end="url(#arrow)"/>
  </g>
  <g id="main-coverage">
    <rect class="box" x="596" y="40" width="108" height="56" rx="16"/>
    <text class="entity" x="650" y="63.5">coverage_ok</text>
    <text class="sub" x="650" y="81.5">all empty</text>
  </g>
  <text class="panel" x="16" y="140">this PR</text>
  <g id="pr-endpoints-doc">
    <rect class="box" x="16" y="156" width="128" height="56" rx="16"/>
    <text class="entity" x="80" y="179.5">openapi.json</text>
    <text class="sub" x="80" y="197.5">REST</text>
  </g>
  <g id="pr-endpoints-fields">
    <rect class="box" x="236" y="156" width="336" height="56" rx="16"/>
    <text class="field" x="404" y="179.5">missing_expected_endpoints</text>
    <text class="field" x="404" y="197.5">unclassified_official_endpoints</text>
  </g>
  <g id="pr-endpoints-read">
    <path class="flow" d="M144 184 H235" marker-end="url(#arrow)"/>
    <text class="edge" x="190" y="176" text-anchor="middle">paths</text>
  </g>
  <g id="pr-endpoints-gate">
    <path class="flow" d="M572 184 H595" marker-end="url(#arrow)"/>
  </g>
  <g id="pr-asyncapi-doc">
    <rect class="box-accent" x="16" y="224" width="128" height="124" rx="16"/>
    <text class="entity" x="80" y="281.5">asyncapi.json</text>
    <text class="sub" x="80" y="299.5">WebSocket</text>
  </g>
  <g id="pr-channels-fields">
    <rect class="box-accent" x="236" y="224" width="336" height="56" rx="16"/>
    <text class="field" x="404" y="247.5">missing_expected_channels</text>
    <text class="field" x="404" y="265.5">unclassified_official_channels</text>
  </g>
  <g id="pr-channels-read">
    <path class="flow" d="M144 252 H235" marker-end="url(#arrow)"/>
    <text class="edge" x="190" y="244" text-anchor="middle">channels</text>
  </g>
  <g id="pr-channels-gate">
    <path class="flow" d="M572 252 H595" marker-end="url(#arrow)"/>
  </g>
  <g id="pr-operations-fields">
    <rect class="box-accent" x="236" y="292" width="336" height="56" rx="16"/>
    <text class="field" x="404" y="315.5">missing_expected_realtime_operations</text>
    <text class="field" x="404" y="333.5">unclassified_official_realtime_operations</text>
  </g>
  <g id="pr-operations-read">
    <path class="flow" d="M144 320 H235" marker-end="url(#arrow)"/>
    <text class="edge" x="190" y="312" text-anchor="middle">operations</text>
  </g>
  <g id="pr-operations-gate">
    <path class="flow" d="M572 320 H595" marker-end="url(#arrow)"/>
  </g>
  <g id="pr-coverage">
    <rect class="box" x="596" y="156" width="108" height="192" rx="16"/>
    <text class="entity" x="650" y="247.5">coverage_ok</text>
    <text class="sub" x="650" y="265.5">all empty</text>
  </g>
  <path class="rule" d="M16 116 H704"/>
</svg>
